<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교회 주보</title>
<meta name="theme-color" content="#2F6B73">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="교회 주보">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#2F6B73;overflow:hidden}
  body{padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
  iframe{display:block;width:100%;height:100%;border:0;background:#F4F7F7}
  .wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
    font:17px/1.6 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#5F564F;background:#F4F7F7;transition:opacity .3s;z-index:5}
  .wait img{width:80px;height:80px;border-radius:19px}
  .wait a{color:#2F6B73;font-size:15px}
  .wait.gone{opacity:0;pointer-events:none}
  .wait .err{max-width:420px;font-size:16px;word-break:keep-all}
</style>
<script src="../config.js"></script>
</head>
<body>
<iframe id="app" title="교회 주보" allow="clipboard-write" hidden></iframe>
<div class="wait" id="wait">
  <img src="icons/icon-192.png" alt="">
  <span id="msg">여는 중입니다</span>
  <a id="direct" hidden>오래 걸리면 여기를 눌러 바로 여세요</a>
</div>
<script>
(function(){
  var C = window.CHURCH_APP || {};
  var church = C.church || '우리교회', EXEC = C.exec || '';
  document.title = church+' 주보';
  var msg = document.getElementById('msg');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(EXEC)){
    msg.className = 'err';
    msg.innerHTML = '<b>아직 설정이 끝나지 않았습니다.</b><br>GitHub의 <b>config.js</b> 파일에 구글 앱스 스크립트 웹 앱 주소를 넣어 주세요.';
    return;
  }
  msg.textContent = document.title + '를 여는 중입니다';
  var q = {}; try{ new URLSearchParams(location.search).forEach(function(v,k){ q[k]=v; }); }catch(e){}
  var url = EXEC + '?app=1' + (q.d ? '&d=' + encodeURIComponent(q.d) : '') + (q.pv ? '&pv=' + encodeURIComponent(q.pv) : '');
  var f = document.getElementById('app'), w = document.getElementById('wait'), direct = document.getElementById('direct');
  direct.href = url;
  f.addEventListener('load', function(){ w.classList.add('gone'); });
  f.title = document.title; f.src = url; f.hidden = false;
  setTimeout(function(){ direct.hidden = false; }, 10000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
<script src="../shared/install.js" data-name="교회 주보" data-icon="icons/icon-192.png" data-color="#2F6B73"></script>
</body>
</html>
